<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADM | Tenda do Cuidar</title>
    <style>
        :root {
            --bg: #fffdfb;
            --bg-soft: #f8f4fc;
            --surface: #ffffff;
            --surface-2: #fbf9fd;

            --ink: #2a2738;
            --ink-soft: #655e76;
            --ink-faint: #948da3;

            --line: #eee7f7;

            --blue: #4d7cc7;
            --blue-deep: #33578f;
            --blue-soft: #e9f1fc;

            --pink: #e585ae;
            --pink-deep: #c85589;
            --pink-soft: #fcedf4;

            --lilac: #9a7fd4;
            --lilac-deep: #7458bb;
            --lilac-soft: #f1ebfb;

            --green: #62b78b;
            --green-deep: #39815e;
            --green-soft: #eaf7ef;

            --yellow: #e7bd5c;
            --scrim: rgba(42, 39, 56, .35);

            --radius: 20px;
        }


        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--ink);

            background:
                radial-gradient(circle at 8% 8%,
                    rgba(154, 127, 212, .18),
                    transparent 28%),
                radial-gradient(circle at 92% 88%,
                    rgba(229, 133, 174, .13),
                    transparent 26%),
                var(--bg);
        }


        button,
        input {
            font: inherit;
        }


        button {
            cursor: pointer;
        }


        /* =========================================================
       ESTRUTURA
    ========================================================= */

        main {
            width: min(1120px, calc(100% - 40px));

            margin: 0 auto;

            padding: 70px 0 90px;
        }


        /* =========================================================
       LOGIN
    ========================================================= */

        #loginArea {
            width: min(470px, 100%);

            margin: 70px auto 0;

            padding: 42px;

            background: rgba(255, 255, 255, .92);

            border: 1px solid var(--line);

            border-radius: 28px;

            box-shadow:
                0 24px 70px -35px rgba(74, 57, 112, .30);

            position: relative;

            overflow: hidden;
        }


        #loginArea::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 5px;

            background:
                linear-gradient(90deg,
                    var(--lilac),
                    var(--pink),
                    var(--blue));
        }


        #loginArea::after {
            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            right: -80px;
            top: -80px;

            border-radius: 50%;

            background: var(--lilac-soft);

            z-index: 0;
        }


        #loginArea>* {
            position: relative;
            z-index: 1;
        }


        #loginArea h1 {
            margin: 0 0 8px;

            font-size: clamp(1.8rem, 4vw, 2.35rem);

            line-height: 1.15;

            letter-spacing: -.035em;

            color: var(--ink);
        }


        #loginArea h1::after {
            content: "Tenda do Cuidar";

            display: block;

            margin-top: 10px;

            color: var(--lilac-deep);

            font-size: .78rem;

            font-weight: 700;

            letter-spacing: .12em;

            text-transform: uppercase;
        }


        #loginForm {
            display: flex;

            flex-direction: column;

            gap: 18px;

            margin-top: 30px;
        }


        #loginForm label {
            display: flex;

            flex-direction: column;

            gap: 8px;

            color: var(--ink-soft);

            font-size: .9rem;

            font-weight: 650;
        }


        #loginForm input {
            width: 100%;

            padding: 14px 16px;

            color: var(--ink);

            background: var(--surface);

            border: 1px solid var(--line);

            border-radius: 13px;

            outline: none;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }


        #loginForm input:hover {
            border-color: #dcd1ed;
        }


        #loginForm input:focus {
            border-color: var(--lilac);

            background: #fff;

            box-shadow:
                0 0 0 4px rgba(154, 127, 212, .13);
        }


        #loginForm button {
            margin-top: 4px;

            border: none;

            padding: 14px 22px;

            border-radius: 100px;

            color: #fff;

            font-weight: 700;

            background:
                linear-gradient(135deg,
                    var(--lilac),
                    var(--lilac-deep));

            box-shadow:
                0 10px 25px -12px rgba(116, 88, 187, .7);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }


        #loginForm button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 30px -12px rgba(116, 88, 187, .75);
        }


        #loginError {
            min-height: 20px;

            margin: 0;

            color: var(--pink-deep);

            font-size: .9rem;

            font-weight: 600;

            text-align: center;
        }


        /* =========================================================
       AGENDA
    ========================================================= */

        #agendaArea {
            animation:
                adminFadeIn .45s ease both;
        }


        @keyframes adminFadeIn {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        #agendaArea h1 {
            margin: 0;

            font-size: clamp(2rem, 5vw, 3rem);

            letter-spacing: -.045em;

            line-height: 1.1;
        }


        #agendaArea h1::after {
            content: "Acompanhe os atendimentos da Tenda do Cuidar";

            display: block;

            margin-top: 12px;

            color: var(--ink-soft);

            font-size: .95rem;

            font-weight: 500;

            letter-spacing: 0;
        }


        #logoutBtn {
            display: block;

            margin: 22px 0 32px auto;

            padding: 10px 18px;

            border: 1px solid var(--line);

            border-radius: 100px;

            color: var(--lilac-deep);

            background: var(--lilac-soft);

            font-weight: 650;

            transition:
                background .2s ease,
                transform .2s ease;
        }


        #logoutBtn:hover {
            background: #e9def8;

            transform: translateY(-1px);
        }


        /* =========================================================
       AGENDA / CARDS
    ========================================================= */

        #agendaContainer {
            display: grid;

            grid-template-columns:
                repeat(auto-fit,
                    minmax(300px, 1fr));

            gap: 20px;
        }


        #agendaContainer>p {
            grid-column: 1 / -1;

            margin: 0;

            padding: 55px 30px;

            text-align: center;

            color: var(--ink-soft);

            background: var(--surface);

            border: 1px dashed #ddd3eb;

            border-radius: var(--radius);
        }


        #agendaContainer article {
            position: relative;

            padding: 26px;

            background: var(--surface);

            border: 1px solid var(--line);

            border-radius: var(--radius);

            box-shadow:
                0 15px 40px -30px rgba(58, 44, 92, .35);

            overflow: hidden;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                border-color .25s ease;
        }


        #agendaContainer article::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 4px;
            height: 100%;

            background:
                linear-gradient(180deg,
                    var(--lilac),
                    var(--pink));
        }


        #agendaContainer article:hover {
            transform: translateY(-4px);

            border-color: #ded5ec;

            box-shadow:
                0 25px 50px -30px rgba(58, 44, 92, .45);
        }


        #agendaContainer article h2 {
            margin: 0 0 20px;

            color: var(--lilac-deep);

            font-size: 1.2rem;

            line-height: 1.3;

            letter-spacing: -.02em;
        }


        #agendaContainer article p {
            margin: 10px 0;

            color: var(--ink-soft);

            font-size: .93rem;

            line-height: 1.55;
        }


        #agendaContainer article strong {
            color: var(--ink);
        }


        #agendaContainer article p:last-child {
            margin-top: 18px;

            padding-top: 15px;

            border-top: 1px solid var(--line);
        }


        /* =========================================================
       RESPONSIVO
    ========================================================= */

        @media (max-width: 700px) {

            main {
                width: min(100% - 24px, 1120px);

                padding-top: 35px;
            }


            #loginArea {
                margin-top: 35px;

                padding: 32px 22px;

                border-radius: 23px;
            }


            #agendaArea h1 {
                font-size: 2rem;
            }


            #logoutBtn {
                width: 100%;

                margin: 20px 0 24px;
            }


            #agendaContainer {
                grid-template-columns: 1fr;
            }

        }


        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;

                transition: none !important;
            }

        }

        .admin-brand {
            display: flex;
            justify-content: center;

            margin-bottom: 28px;
        }

        .admin-brand img {
            width: auto;
            height: 200px;
        }
    </style>
</head>

<body>

    <main>

        <div class="admin-brand">
            <img src="logo_tenda.png" alt="Tenda do Cuidar">
        </div>
        <section id="loginArea">
            <h1>Área administrativa</h1>

            <form id="loginForm">
                <label>
                    E-mail
                    <input type="email" id="adminEmail" required>
                </label>

                <label>
                    Senha
                    <input type="password" id="adminPassword" required>
                </label>

                <button type="submit">Entrar</button>

                <p id="loginError"></p>
            </form>
        </section>

        <section id="agendaArea" hidden>
            <h1>Agenda de consultas</h1>

            <button id="logoutBtn" type="button">
                Sair
            </button>

            <div id="agendaContainer">
                Carregando agenda...
            </div>
        </section>
    </main>

    <script>
        const API_URL = window.location.origin;

        const loginArea =
            document.getElementById("loginArea");

        const agendaArea =
            document.getElementById("agendaArea");

        const loginForm =
            document.getElementById("loginForm");

        const loginError =
            document.getElementById("loginError");

        const agendaContainer =
            document.getElementById("agendaContainer");

        const logoutBtn =
            document.getElementById("logoutBtn");


        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            loginError.textContent = "";

            const email =
                document.getElementById("adminEmail").value.trim();

            const password =
                document.getElementById("adminPassword").value;

            try {

                const resposta =
                    await fetch(
                        API_URL + "/admin/login",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                email,
                                password
                            })
                        }
                    );

                const texto =
                    await resposta.text();

                let dados = {};

                if (texto.trim()) {

                    try {

                        dados =
                            JSON.parse(texto);

                    } catch (error) {

                        throw new Error(
                            "O servidor respondeu em formato inválido."
                        );

                    }

                }

                if (!resposta.ok) {

                    throw new Error(
                        dados.erro ||
                        "Não foi possível entrar."
                    );

                }

                if (!dados.token) {

                    throw new Error(
                        "Login realizado, mas o servidor não enviou o token."
                    );

                }

                localStorage.setItem(
                    "adminToken",
                    dados.token
                );

                mostrarAgenda();

            } catch (error) {

                loginError.textContent =
                    error.message;

            }


        });


        async function mostrarAgenda() {

            const token =
                localStorage.getItem("adminToken");

            if (!token) {

                return;

            }

            loginArea.hidden = true;

            agendaArea.hidden = false;

            agendaContainer.textContent =
                "Carregando agenda...";


            try {

                const resposta =
                    await fetch(
                        API_URL + "/admin/agendamentos",
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const texto =
                    await resposta.text();

                let dados = {};

                if (texto.trim()) {

                    try {

                        dados =
                            JSON.parse(texto);

                    } catch (error) {

                        throw new Error(
                            "O servidor respondeu em formato inválido."
                        );

                    }

                }


                if (!resposta.ok) {

                    throw new Error(
                        dados.erro ||
                        "Erro ao carregar a agenda."
                    );

                }


                renderizarAgenda(
                    dados.agendamentos || []
                );


            } catch (error) {

                agendaContainer.innerHTML = `
            <div class="admin-error">
                <strong>Não foi possível carregar a agenda.</strong>
                <p>${escapar(error.message)}</p>
            </div>
        `;

            }

        }


        function renderizarAgenda(agendamentos) {

            if (!agendamentos.length) {

                agendaContainer.innerHTML =
                    "<p>Nenhum agendamento encontrado.</p>";

                return;

            }

            agendaContainer.innerHTML =
                agendamentos.map(
                    agendamento => `
                        <article>
                            <h2>
                                ${escapar(
                        agendamento.nome_crianca
                    )}
                            </h2>

                            <p>
                                <strong>Data:</strong>
                                ${escapar(
                        agendamento.data_consulta
                    )}
                            </p>

                            <p>
                                <strong>Horário:</strong>
                                ${escapar(
                        agendamento.hora_inicio
                    )}
                                -
                                ${escapar(
                        agendamento.hora_fim
                    )}
                            </p>

                            <p>
                                <strong>Profissional:</strong>
                                ${escapar(
                        agendamento.profissional
                    )}
                            </p>

                            <p>
                                <strong>Responsável:</strong>
                                ${escapar(
                        agendamento.nome_responsavel
                    )}
                            </p>

                            <p>
                                <strong>WhatsApp:</strong>
                                ${escapar(
                        agendamento.whatsapp_responsavel
                    )}
                            </p>

                            <p>
                                <strong>E-mail:</strong>
                                ${escapar(
                        agendamento.email_responsavel
                    )}
                            </p>

                            <p>
                                <strong>Status:</strong>
                                ${escapar(
                        agendamento.status
                    )}
                            </p>
                        </article>
                    `
                ).join("");

        }


        function escapar(valor) {

            const div =
                document.createElement("div");

            div.textContent =
                valor ?? "";

            return div.innerHTML;

        }


        logoutBtn.addEventListener(
            "click",
            function () {

                localStorage.removeItem(
                    "adminToken"
                );

                agendaArea.hidden = true;
                loginArea.hidden = false;

                loginForm.reset();

            }
        );


        if (
            localStorage.getItem("adminToken")
        ) {

            mostrarAgenda();

        }

    </script>

</body>

</html>
